  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.7"/>
  
