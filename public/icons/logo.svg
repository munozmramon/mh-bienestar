      <stop offset="100%" stop-color="#142219"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1CA8B"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#AA884E"/>
